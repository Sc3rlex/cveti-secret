<script type="text/babel">

// ── Utilities ─────────────────────────────────────────────────────
const useIsMobile = () => {
  const [m, setM] = React.useState(() => window.innerWidth < 768);
  React.useEffect(() => {
    const h = () => setM(window.innerWidth < 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return m;
};

// Update this phone number
const PHONE = '+359000000000';

const PhoneIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.68 13.6a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.6a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 18z"/>
  </svg>
);

// ── Header ────────────────────────────────────────────────────────
const Header = ({ activePage, onNavigate }) => {
  const isMobile = useIsMobile();
  const [menuOpen, setMenuOpen] = React.useState(false);

  const navLinks = [
    { id:'home', label:'Начало' },
    { id:'services', label:'Услуги' },
    { id:'salon', label:'Салонът' },
    { id:'gallery', label:'Галерия' },
    { id:'contact', label:'Контакти' },
  ];

  const go = id => { setMenuOpen(false); onNavigate(id); };

  React.useEffect(() => { if (!isMobile) setMenuOpen(false); }, [isMobile]);
  React.useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [menuOpen]);

  if (isMobile) return (
    <>
      <header style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, background:'rgba(10,10,10,0.96)', backdropFilter:'blur(10px)', borderBottom:'1px solid rgba(255,255,255,0.06)', height:'56px', display:'flex', alignItems:'center', padding:'0 16px' }}>
        {/* Hamburger */}
        <button onClick={() => setMenuOpen(true)} style={{ background:'transparent', border:'none', cursor:'pointer', padding:'8px 8px 8px 0', display:'flex', flexDirection:'column', gap:'5px', flexShrink:0 }}>
          {[0,1,2].map(i => <div key={i} style={{ width:'22px', height:'2px', background:'#b87333', borderRadius:'2px' }} />)}
        </button>
        {/* Logo centered */}
        <div onClick={() => go('home')} style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', cursor:'pointer' }}>
          <img src="assets/logo-ring-bronze.png" alt="Cveti's Secret" style={{ height:'34px', display:'block' }} />
        </div>
        {/* Phone */}
        <div style={{ marginLeft:'auto' }}>
          <a href={`tel:${PHONE}`} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'36px', height:'36px', borderRadius:'50%', border:'1px solid rgba(184,115,51,0.5)', color:'#b87333', textDecoration:'none' }}>
            <PhoneIcon />
          </a>
        </div>
      </header>

      {/* Drawer */}
      <div style={{ position:'fixed', inset:0, zIndex:200, pointerEvents: menuOpen ? 'all' : 'none' }}>
        <div onClick={() => setMenuOpen(false)} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.75)', opacity: menuOpen ? 1 : 0, transition:'opacity 0.3s ease' }} />
        <div style={{ position:'absolute', left:0, top:0, bottom:0, width:'75vw', maxWidth:'300px', background:'#0c0c0c', borderRight:'1px solid rgba(184,115,51,0.15)', transform: menuOpen ? 'translateX(0)' : 'translateX(-100%)', transition:'transform 0.38s cubic-bezier(0.16,1,0.3,1)', display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ height:'2px', background:'linear-gradient(90deg,#b87333,rgba(184,115,51,0.1))', flexShrink:0 }} />
          <div style={{ padding:'28px 24px 22px', borderBottom:'1px solid rgba(184,115,51,0.08)' }}>
            <div style={{ fontFamily:"'Cinzel',serif", fontSize:'15px', fontWeight:600, letterSpacing:'0.12em', background:'linear-gradient(90deg,#edd9bc,#b87333)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>Cveti's Secret</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'12px', fontStyle:'italic', color:'#9e8e6a', marginTop:'3px', letterSpacing:'0.1em' }}>Beauty Salon</div>
          </div>
          <nav style={{ flex:1, padding:'12px 0', overflowY:'auto' }}>
            {navLinks.map(link => (

              </div>
            ))}
          </nav>
          <div style={{ padding:'20px 24px', borderTop:'1px solid rgba(184,115,51,0.08)' }}>
            <a href={`tel:${PHONE}`} style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', padding:'13px', borderRadius:'6px', background:'linear-gradient(90deg,#edd9bc,#b87333,#7a4520)', fontFamily:"'Cinzel',serif", fontSize:'10px', fontWeight:600, letterSpacing:'0.14em', textTransform:'uppercase', color:'#0a0a0a', textDecoration:'none' }}>

    <header style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, background:'rgba(10,10,10,0.96)', backdropFilter:'blur(10px)', borderBottom:'1px solid rgba(255,255,255,0.06)', height:'76px', display:'flex', alignItems:'center', padding:'0 40px' }}>

      </div>
      {/* Nav centered */}
      <nav style={{ flex:1, display:'flex', gap:'44px', alignItems:'center', justifyContent:'center' }}>

          <span key={link.id} onClick={() => onNavigate(link.id)}

            onMouseLeave={e => e.target.style.color=activePage===link.id?'#b87333':'rgba(240,232,208,0.8)'}

      <a href={`tel:${PHONE}`} style={{ flexShrink:0, display:'flex', alignItems:'center', gap:'9px', padding:'11px 22px', borderRadius:'4px', border:'1px solid rgba(184,115,51,0.5)', color:'#b87333', textDecoration:'none', fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.12em', transition:'all 0.3s ease' }}

      </a>
    </header>
  );
};

// ── Hero ──────────────────────────────────────────────────────────
const Hero = ({ onNavigate }) => {

  const [btnVis, setBtnVis] = React.useState(false);
  const [imgVis, setImgVis] = React.useState(false);

  React.useEffect(() => {
    const t1 = setTimeout(() => setTagVis(true), 200);
    const t2 = setTimeout(() => setTitleVis(true), 500);
    const t3 = setTimeout(() => setBtnVis(true), 900);
    const t4 = setTimeout(() => setImgVis(true), 300);
    return () => [t1,t2,t3,t4].forEach(clearTimeout);
  }, []);

  const hH = isMobile ? 56 : 76;

  if (isMobile) return (
    <section style={{ position:'relative', width:'100%', minHeight:'100vh', background:'#0d0d0d', overflow:'hidden', display:'flex', alignItems:'flex-end', paddingTop:`${hH}px` }}>

        </div>
        <h1 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'clamp(24px,6vw,36px)', fontWeight:400, fontStyle:'italic', lineHeight:1.4, color:'#f0e8d0', margin:'0 0 28px', letterSpacing:'0.02em', opacity:titleVis?1:0, transform:titleVis?'translateY(0)':'translateY(20px)', transition:'opacity 0.8s ease,transform 0.8s ease' }}>
          От Чикаго до България –<br />Cveti's Secret започва с<br />експертиза в русите коси и<br />балеажа и се развива в<br />пространство за цялостна<br />грижа за визията.
        </h1>
        <div style={{ opacity:btnVis?1:0, transform:btnVis?'translateY(0)':'translateY(16px)', transition:'opacity 0.7s ease,transform 0.7s ease' }}>
          <button onClick={() => onNavigate('contact')} style={{ display:'inline-flex', alignItems:'center', gap:'12px', fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.12em', color:'#f0e8d0', background:'transparent', border:'1px solid rgba(240,232,208,0.5)', borderRadius:'4px', padding:'12px 20px 12px 24px', cursor:'pointer' }}>
            Запази час
            <span style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', width:'28px', height:'28px', borderRadius:'50%', background:'rgba(240,232,208,0.12)', fontSize:'14px' }}>↗</span>
          </button>
        </div>
      </div>
    </section>
  );

  // Desktop
  return (
    <section style={{ position:'relative', width:'100%', minHeight:'100vh', background:'#0d0d0d', overflow:'hidden', display:'flex', alignItems:'center', paddingTop:'76px' }}>
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 30% 60%, rgba(20,15,5,1) 0%, #0a0a0a 60%, #080808 100%)' }} />
      <div style={{ position:'absolute', bottom:'-80px', left:'-60px', width:'400px', height:'300px', background:'radial-gradient(circle,rgba(184,115,51,0.07) 0%,transparent 70%)', pointerEvents:'none' }} />
      <div style={{ position:'relative', zIndex:2, display:'flex', alignItems:'center', justifyContent:'space-between', width:'100%', minHeight:'calc(100vh - 64px)', padding:'0 0 0 5vw' }}>
        <div style={{ flex:'0 0 auto', maxWidth:'420px', paddingBottom:'40px', paddingTop:'20px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'20px', opacity:tagVis?1:0, transform:tagVis?'translateY(0)':'translateY(12px)', transition:'opacity 0.6s ease,transform 0.6s ease' }}>
            <div style={{ width:'28px', height:'2px', background:'linear-gradient(90deg,#edd9bc,#b87333)' }} />
            <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'13px', letterSpacing:'0.08em', color:'rgba(240,232,208,0.7)' }}>С над 10 години опит</span>
          </div>
          <h1 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'clamp(28px,3.5vw,44px)', fontWeight:400, fontStyle:'italic', lineHeight:1.35, color:'#f0e8d0', margin:'0 0 36px', letterSpacing:'0.02em', opacity:titleVis?1:0, transform:titleVis?'translateY(0)':'translateY(20px)', transition:'opacity 0.8s ease,transform 0.8s ease' }}>
            От Чикаго до България –<br />Cveti's Secret започва с<br />експертиза в русите коси и<br />балеажа и се развива в<br />пространство за цялостна<br />грижа за визията.
          </h1>
          <div style={{ opacity:btnVis?1:0, transform:btnVis?'translateY(0)':'translateY(16px)', transition:'opacity 0.7s ease,transform 0.7s ease' }}>
            <button onClick={() => onNavigate('contact')} style={{ display:'inline-flex', alignItems:'center', gap:'12px', fontFamily:"'Cinzel',serif", fontSize:'12px', fontWeight:400, letterSpacing:'0.12em', color:'#f0e8d0', background:'transparent', border:'1px solid rgba(240,232,208,0.5)', borderRadius:'4px', padding:'12px 20px 12px 24px', cursor:'pointer', transition:'all 0.35s ease' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor='#b87333'; e.currentTarget.style.color='#b87333'; e.currentTarget.style.boxShadow='0 0 16px rgba(184,115,51,0.2)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='rgba(240,232,208,0.5)'; e.currentTarget.style.color='#f0e8d0'; e.currentTarget.style.boxShadow='none'; }}>
              Запази час
              <span style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', width:'28px', height:'28px', borderRadius:'50%', background:'rgba(240,232,208,0.12)', fontSize:'14px', color:'inherit' }}>↗</span>
            </button>
          </div>
        </div>
        <div style={{ flex:'1 1 auto', display:'flex', justifyContent:'flex-end', alignItems:'flex-end', alignSelf:'stretch', position:'relative', opacity:imgVis?1:0, transform:imgVis?'translateX(0)':'translateX(40px)', transition:'opacity 1s ease,transform 1s ease' }}>
          <img src="assets/team.png" alt="Cveti's Secret Team" style={{ height:'100%', maxHeight:'calc(100vh - 64px)', width:'auto', objectFit:'contain', objectPosition:'right bottom', display:'block', maskImage:'linear-gradient(to right,transparent 0%,rgba(0,0,0,0.4) 20%,black 45%)', WebkitMaskImage:'linear-gradient(to right,transparent 0%,rgba(0,0,0,0.4) 20%,black 45%)' }} />
        </div>
      </div>
    </section>
  );
};

// ── Before/After Slider (touch + mouse) ──────────────────────────
const BeforeAfterSlider = ({ label, before, after }) => {
  const isMobile = useIsMobile();
  const [pos, setPos] = React.useState(50);
  const [active, setActive] = React.useState(false);
  const [touchedOnce, setTouchedOnce] = React.useState(false);
  const containerRef = React.useRef(null);
  const dragging = React.useRef(false);

  const updatePos = React.useCallback(clientX => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setPos(Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100)));
  }, []);

  const showHint = isMobile ? !touchedOnce : !active;

  return (
    <div ref={containerRef}
      onMouseEnter={() => { if (!isMobile) setActive(true); }}
      onMouseMove={e => { if (!isMobile && active) updatePos(e.clientX); }}
      onMouseLeave={() => { if (!isMobile) { setActive(false); setPos(50); } }}
      onTouchStart={e => { dragging.current = true; setActive(true); setTouchedOnce(true); updatePos(e.touches[0].clientX); }}
      onTouchMove={e => { e.preventDefault(); if (dragging.current) updatePos(e.touches[0].clientX); }}
      onTouchEnd={() => { dragging.current = false; setActive(false); }}
      style={{ position:'relative', width: isMobile ? '100%' : '300px', maxWidth: isMobile ? '480px' : '300px', height:'300px', borderRadius:'10px', overflow:'hidden', border:'1px solid rgba(184,115,51,0.3)', cursor: isMobile ? 'grab' : 'col-resize', flexShrink:0, userSelect:'none', touchAction:'none' }}
    >
      {/* After — background, visible on right */}
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(135deg,#1a2a10,#0d1a08,#0a0d0a)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
        {after
          ? <img src={after} alt="после" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
          : <span style={{ fontFamily:"'Cinzel',serif", fontSize:'11px', letterSpacing:'0.14em', color:'rgba(184,115,51,0.3)', textTransform:'uppercase' }}>После</span>
        }
      </div>
      {/* Before — clipped, visible on left */}
      <div style={{ position:'absolute', inset:0, clipPath:`inset(0 ${100-pos}% 0 0)`, transition: active?'none':'clip-path 0.05s ease', background:'linear-gradient(135deg,#2a1e08,#1a1208,#0d0d0d)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
        {before
          ? <img src={before} alt="преди" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
          : <span style={{ fontFamily:"'Cinzel',serif", fontSize:'11px', letterSpacing:'0.14em', color:'rgba(184,115,51,0.3)', textTransform:'uppercase' }}>Преди</span>
        }
      </div>
      <div style={{ position:'absolute', top:0, bottom:0, left:`${pos}%`, width:'2px', background:'linear-gradient(180deg,transparent,#b87333 20%,#edd9bc 50%,#b87333 80%,transparent)', transform:'translateX(-50%)', boxShadow:'0 0 8px rgba(184,115,51,0.6)', pointerEvents:'none' }} />
      <div style={{ position:'absolute', top:'50%', left:`${pos}%`, transform:'translate(-50%,-50%)', width:'36px', height:'36px', borderRadius:'50%', background:'linear-gradient(135deg,#edd9bc,#b87333)', boxShadow:'0 0 12px rgba(184,115,51,0.7)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'12px', color:'#0a0a0a', fontWeight:700, pointerEvents:'none' }}>⇔</div>
      <div style={{ position:'absolute', bottom:'12px', left:'12px', fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', color:'rgba(184,115,51,0.7)', textTransform:'uppercase', background:'rgba(0,0,0,0.6)', padding:'4px 8px', borderRadius:'3px' }}>Преди</div>
      <div style={{ position:'absolute', bottom:'12px', right:'12px', fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', color:'rgba(184,115,51,0.7)', textTransform:'uppercase', background:'rgba(0,0,0,0.6)', padding:'4px 8px', borderRadius:'3px' }}>След</div>
      <div style={{ position:'absolute', top:'14px', left:'50%', transform:'translateX(-50%)', fontFamily:"'Cormorant Garamond',serif", fontSize:'13px', fontStyle:'italic', color:'rgba(240,232,208,0.8)', whiteSpace:'nowrap', background:'rgba(0,0,0,0.5)', padding:'3px 10px', borderRadius:'3px' }}>{label}</div>
      {showHint && (
        <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.3)', fontFamily:"'Cinzel',serif", fontSize:'10px', letterSpacing:'0.12em', color:'rgba(184,115,51,0.8)', textTransform:'uppercase', flexDirection:'column', gap:'6px', pointerEvents:'none' }}>

          <span>{isMobile ? 'Плъзни' : 'Движи мишката'}</span>
        </div>
      )}
    </div>
  );

// Loads Instagram embed.js once, then processes all blockquotes
const loadInstagramEmbed = () => {
  return new Promise(resolve => {
    if (window.instgrm) { resolve(); return; }
    const existing = document.querySelector('script[src*="instagram.com/embed"]');
    if (existing) { existing.addEventListener('load', resolve); return; }
    const s = document.createElement('script');
    s.src = 'https://www.instagram.com/embed.js';
    s.async = true;
    s.onload = resolve;
    document.body.appendChild(s);
  });
};

const InstagramEmbed = ({ url }) => {
  React.useEffect(() => {
    loadInstagramEmbed().then(() => {
      if (window.instgrm) window.instgrm.Embeds.process();
    });
  }, [url]);
  return (
    <div className="ig-wrapper">
      <blockquote
        className="instagram-media"
        data-instgrm-permalink={url}
        data-instgrm-version="14"
        data-instgrm-captionhidden="1"
        style={{ background:'#FFF', border:0, margin:0, maxWidth:'326px', minWidth:'326px', padding:0, width:'326px' }}

    </div>
  );
};

        </div>
      </div>
    </section>
  );
};

// ── Shared ────────────────────────────────────────────────────────
const SectionDivider = () => (
  <div style={{ display:'flex', alignItems:'center', gap:'16px', padding:'0 40px', background:'#0a0a0a' }}>
    <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,transparent,rgba(184,115,51,0.15))' }} />
    <span style={{ color:'rgba(184,115,51,0.3)', fontSize:'12px' }}>❧ ✦ ❧</span>
    <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,rgba(184,115,51,0.15),transparent)' }} />
  </div>
);

const GoldDust = () => {
  const isMobile = useIsMobile();
  const count = isMobile ? 40 : 80;
  const particles = React.useMemo(() => Array.from({length:count}, (_,i) => ({
    id:i, x:Math.random()*100, y:Math.random()*100,
    size:Math.random()*3+0.5, dur:Math.random()*6+4,
    delay:Math.random()*8, opacity:Math.random()*0.5+0.1,
    drift:(Math.random()-0.5)*30,
  })), [count]);
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden' }}>
      <style>{`@keyframes goldFloat{0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:var(--op)}33%{transform:translateY(-18px) translateX(var(--dx)) scale(1.3);opacity:calc(var(--op)*1.8)}66%{transform:translateY(-8px) translateX(calc(var(--dx)*-0.5)) scale(0.8);opacity:calc(var(--op)*0.6)}}`}</style>
      {particles.map(p => (
        <div key={p.id} style={{ position:'absolute', left:`${p.x}%`, top:`${p.y}%`, width:`${p.size}px`, height:`${p.size}px`, borderRadius:'50%', background:p.size>2.5?'#edd9bc':'#b87333', '--op':p.opacity, '--dx':`${p.drift}px`, animation:`goldFloat ${p.dur}s ${p.delay}s ease-in-out infinite`, boxShadow:p.size>2?`0 0 ${p.size*2}px rgba(184,115,51,0.6)`:'none' }} />
      ))}
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────
const PAGES = ['home','services','salon','gallery','contact'];

const App = () => {
  const isMobile = useIsMobile();
  const [activePage, setActivePage] = React.useState('home');
  const headerH = isMobile ? 56 : 64;

  const handleNavigate = page => {
    if (!PAGES.includes(page)) return;
    setActivePage(page);
    const el = document.getElementById(page);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - headerH, behavior:'smooth' });
  };

  React.useEffect(() => {
    const onScroll = () => {
      const scrollY = window.scrollY + 100;
      for (let i = PAGES.length - 1; i >= 0; i--) {
        const el = document.getElementById(PAGES[i]);
        if (el && el.offsetTop <= scrollY) { setActivePage(PAGES[i]); break; }
      }
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div>
      <GoldDust />
      <Header activePage={activePage} onNavigate={handleNavigate} />
      <div id="home"><Hero onNavigate={handleNavigate} /></div>
      <SectionDivider />
      <div id="services"><Services onNavigate={handleNavigate} /></div>
      <SectionDivider />
      <div id="salon"><Team /></div>
      <SectionDivider />
      <div id="gallery"><Gallery /></div>
      <SectionDivider />
      <div id="contact"><Contact /></div>
      <Footer onNavigate={handleNavigate} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
