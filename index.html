const useIsMobile = () => {
  const [m, setM] = React.useState(() => window.innerWidth < 768);
  React.useEffect(() => {
    const h = () => setM(window.innerWidth < 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return m;
};

        <>

            <div style={{ fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', textTransform:'uppercase', color:hovered?'#b87333':'rgba(240,232,208,0.55)', transition:'color 0.3s ease' }}>Виж ↓</div>

// Renders a single item row (laser table OR bionic OR standard)
const ServiceItemRow = ({ item, subName, isMobile, itemsVisible, i, hideBooking }) => {
  const delay = `${Math.min(i, 12) * 0.05}s`;
  const vis = { opacity:itemsVisible?1:0, transform:itemsVisible?'translateX(0)':'translateX(-12px)', transition:`opacity 0.3s ease ${delay},transform 0.3s ease ${delay}` };
  if (item.prices) {
    // Laser: show 1/3/6 price table row
    return (
      <div style={{ ...vis, padding:'10px 0', borderBottom:'1px solid rgba(184,115,51,0.08)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px', flexWrap: isMobile ? 'wrap' : 'nowrap' }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize: isMobile ? '15px' : '17px', letterSpacing:'0.03em', flex:1, minWidth:'120px', background:'linear-gradient(135deg,#f8edd8,#edd9bc,#d4b870)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>{item.name}</div>
          <div style={{ display:'flex', gap: isMobile ? '8px' : '14px', flexShrink:0 }}>
            {item.prices.map((p, pi) => (
              <div key={pi} style={{ textAlign:'center', minWidth: isMobile ? '52px' : '66px' }}>
                <div style={{ fontFamily:"'Cinzel',serif", fontSize: isMobile ? '10px' : '12px', fontWeight:600, color:'#b87333', letterSpacing:'0.04em' }}>{p}</div>
                <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize: isMobile ? '9px' : '10px', color:'rgba(184,115,51,0.5)', letterSpacing:'0.06em', marginTop:'2px' }}>{pi===0?'1 проц.':pi===1?'3 проц.':'6 проц.'}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }
  if (item.packPrice) {
    // BIONIC: single + pack price
    return (
      <div style={{ ...vis, padding:'10px 0', borderBottom:'1px solid rgba(184,115,51,0.08)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px', flexWrap: isMobile ? 'wrap' : 'nowrap' }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize: isMobile ? '15px' : '17px', letterSpacing:'0.03em', flex:1, background:'linear-gradient(135deg,#f8edd8,#edd9bc,#d4b870)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>{item.name}</div>
          <div style={{ display:'flex', gap:'14px', flexShrink:0, alignItems:'center' }}>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontFamily:"'Cinzel',serif", fontSize: isMobile ? '11px' : '13px', fontWeight:600, color:'#b87333' }}>{item.price}</div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'9px', color:'rgba(184,115,51,0.5)', letterSpacing:'0.06em', marginTop:'1px' }}>единична</div>
            </div>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontFamily:"'Cinzel',serif", fontSize: isMobile ? '11px' : '13px', fontWeight:600, color:'#edd9bc' }}>{item.packPrice}</div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'9px', color:'rgba(240,232,208,0.35)', letterSpacing:'0.06em', marginTop:'1px' }}>пакет 10</div>
            </div>
          </div>
        </div>
      </div>
    );
  }
  // Standard item
  const bookLink = item.link || BOOKING_DEFAULT;
  const isPhone = bookLink.startsWith('tel:');
  return (
    <div style={{ ...vis, padding: isMobile ? '12px 0' : '14px 0', borderBottom:'1px solid rgba(184,115,51,0.08)' }}>
      {isMobile ? (
        <>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom: hideBooking ? '0' : '8px', gap:'12px' }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'16px', letterSpacing:'0.03em', flex:1, background:'linear-gradient(135deg,#f8edd8,#edd9bc,#d4b870)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>{item.name}</div>
            <span style={{ fontFamily:"'Cinzel',serif", fontSize:'12px', fontWeight:600, color:'#b87333', letterSpacing:'0.06em', flexShrink:0 }}>{item.price}</span>
          </div>
          {!hideBooking && <a href={bookLink} target={isPhone?'_self':'_blank'} rel="noopener noreferrer" style={{ fontFamily:"'Cinzel',serif", fontSize:'10px', fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'#0a0a0a', background:'#edd9bc', borderRadius:'4px', padding:'8px 16px', textDecoration:'none', display:'inline-block' }}>{isPhone?'Обади се':'Запази сега'}</a>}
        </>
      ) : (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'18px', letterSpacing:'0.04em', background:'linear-gradient(135deg,#f8edd8,#edd9bc,#d4b870)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>{item.name}</div>
            <div style={{ fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.14em', color:'rgba(184,115,51,0.5)', textTransform:'uppercase', marginTop:'2px' }}>{subName}</div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:'20px', flexShrink:0 }}>
            <span style={{ fontFamily:"'Cinzel',serif", fontSize:'14px', fontWeight:600, color:'#b87333', letterSpacing:'0.06em' }}>{item.price}</span>
            {!hideBooking && <a href={bookLink} target={isPhone?'_self':'_blank'} rel="noopener noreferrer" style={{ fontFamily:"'Cinzel',serif", fontSize:'10px', fontWeight:600, letterSpacing:'0.14em', textTransform:'uppercase', color:'#0a0a0a', background:'#edd9bc', borderRadius:'4px', padding:'9px 18px', textDecoration:'none', display:'inline-block', boxShadow:'0 2px 12px rgba(184,115,51,0.25)', whiteSpace:'nowrap', transition:'all 0.3s ease' }}
              onMouseEnter={e=>{e.currentTarget.style.opacity='0.85';}}
              onMouseLeave={e=>{e.currentTarget.style.opacity='1';}}
            >{isPhone?'Обади се':'Запази сега'}</a>}
          </div>
        </div>
      )}
    </div>
  );
};

const ServicesOverlay = ({ open, onClose, initialGroup }) => {
  const isMobile = useIsMobile();
  const [activeSub, setActiveSub] = React.useState(0);
  const [itemsVisible, setItemsVisible] = React.useState(false);
  const [dragY, setDragY] = React.useState(0);
  const touchStartY = React.useRef(0);
  const dragging = React.useRef(false);
  const groupIdx = initialGroup ?? 0;
  const group = SERVICES_DATA[groupIdx];

  React.useEffect(() => {
    if (open) { setActiveSub(0); setItemsVisible(false); const t = setTimeout(() => setItemsVisible(true), 200); return () => clearTimeout(t); }
  }, [open, initialGroup]);

  React.useEffect(() => {
    if (open) { setItemsVisible(false); const t = setTimeout(() => setItemsVisible(true), 80); return () => clearTimeout(t); }
  }, [activeSub]);

  React.useEffect(() => {

// ── Before/After Slider (touch + mouse) ──────────────────────────
const BeforeAfterSlider = ({ label, before, after }) => {
  const isMobile = useIsMobile();
  const [pos, setPos] = React.useState(50);
  const [active, setActive] = React.useState(false);
  const [touchedOnce, setTouchedOnce] = React.useState(false);
  const containerRef = React.useRef(null);
  const dragging = React.useRef(false);

  const updatePos = React.useCallback(clientX => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setPos(Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100)));
  }, []);

  const showHint = isMobile ? !touchedOnce : !active;

  return (
    <div ref={containerRef}
      onMouseEnter={() => { if (!isMobile) setActive(true); }}
      onMouseMove={e => { if (!isMobile && active) updatePos(e.clientX); }}
      onMouseLeave={() => { if (!isMobile) { setActive(false); setPos(50); } }}
      onTouchMove={e => { e.preventDefault(); if (dragging.current) updatePos(e.touches[0].clientX); }}
      onTouchEnd={() => { dragging.current = false; setActive(false); }}
      style={{ position:'relative', width:'100%', maxWidth: isMobile ? '480px' : '100%', height: isMobile ? '420px' : '440px', borderRadius:'10px', overflow:'hidden', border:'1px solid rgba(184,115,51,0.3)', cursor: isMobile ? 'default' : 'col-resize', userSelect:'none', touchAction: dragging.current ? 'none' : 'pan-y' }}
    >
      {/* After — background, visible on right */}
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(135deg,#1a2a10,#0d1a08,#0a0d0a)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
        {after
          ? <img src={after} alt="после" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
          : <span style={{ fontFamily:"'Cinzel',serif", fontSize:'11px', letterSpacing:'0.14em', color:'rgba(184,115,51,0.3)', textTransform:'uppercase' }}>После</span>
        }
      </div>
      {/* Before — clipped, visible on left */}
      <div style={{ position:'absolute', inset:0, clipPath:`inset(0 ${100-pos}% 0 0)`, transition: active?'none':'clip-path 0.05s ease', background:'linear-gradient(135deg,#2a1e08,#1a1208,#0d0d0d)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
        {before
          ? <img src={before} alt="преди" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
          : <span style={{ fontFamily:"'Cinzel',serif", fontSize:'11px', letterSpacing:'0.14em', color:'rgba(184,115,51,0.3)', textTransform:'uppercase' }}>Преди</span>
        }
      </div>
      <div style={{ position:'absolute', top:0, bottom:0, left:`${pos}%`, width:'2px', background:'linear-gradient(180deg,transparent,#b87333 20%,#edd9bc 50%,#b87333 80%,transparent)', transform:'translateX(-50%)', boxShadow:'0 0 8px rgba(184,115,51,0.6)', pointerEvents:'none' }} />
      {/* Handle — touch starts ONLY here on mobile */}
      <div
        onTouchStart={e => { e.stopPropagation(); dragging.current = true; setActive(true); setTouchedOnce(true); updatePos(e.touches[0].clientX); }}
        style={{ position:'absolute', top:'50%', left:`${pos}%`, transform:'translate(-50%,-50%)', width: isMobile ? '56px' : '36px', height: isMobile ? '56px' : '36px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor: isMobile ? 'grab' : 'col-resize', touchAction:'none', zIndex:10 }}>
        <div style={{ width:'36px', height:'36px', borderRadius:'50%', background:'linear-gradient(135deg,#edd9bc,#b87333)', boxShadow:'0 0 12px rgba(184,115,51,0.7)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'12px', color:'#0a0a0a', fontWeight:700, pointerEvents:'none' }}>⇔</div>
      </div>
      <div style={{ position:'absolute', bottom:'12px', left:'12px', fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', color:'rgba(184,115,51,0.7)', textTransform:'uppercase', background:'rgba(0,0,0,0.6)', padding:'4px 8px', borderRadius:'3px' }}>Преди</div>
      <div style={{ position:'absolute', bottom:'12px', right:'12px', fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', color:'rgba(184,115,51,0.7)', textTransform:'uppercase', background:'rgba(0,0,0,0.6)', padding:'4px 8px', borderRadius:'3px' }}>След</div>
      <div style={{ position:'absolute', top:'14px', left:'50%', transform:'translateX(-50%)', fontFamily:"'Cormorant Garamond',serif", fontSize:'13px', fontStyle:'italic', color:'rgba(240,232,208,0.8)', whiteSpace:'nowrap', background:'rgba(0,0,0,0.5)', padding:'3px 10px', borderRadius:'3px' }}>{label}</div>
      {showHint && (
        <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.3)', fontFamily:"'Cinzel',serif", fontSize:'10px', letterSpacing:'0.12em', color:'rgba(184,115,51,0.8)', textTransform:'uppercase', flexDirection:'column', gap:'6px', pointerEvents:'none' }}>
          <span style={{ fontSize:'20px' }}>⇔</span>
          <span>{isMobile ? 'Плъзни' : ''}</span>
        </div>
      )}

  );

// Loads Instagram embed.js once, then processes all blockquotes
const loadInstagramEmbed = () => {
  return new Promise(resolve => {
    if (window.instgrm) { resolve(); return; }
    const existing = document.querySelector('script[src*="instagram.com/embed"]');
    if (existing) { existing.addEventListener('load', resolve); return; }
    const s = document.createElement('script');
    s.src = 'https://www.instagram.com/embed.js';
    s.async = true;
    s.onload = resolve;
    document.body.appendChild(s);
  });
};

const InstagramEmbed = ({ url }) => {
  React.useEffect(() => {
    loadInstagramEmbed().then(() => {
      if (window.instgrm) window.instgrm.Embeds.process();
    });
  }, [url]);
  return (
    <div className="ig-wrapper">
      <blockquote
        className="instagram-media"

const SectionDivider = () => (
  <div style={{ display:'flex', alignItems:'center', gap:'16px', padding:'0 40px', background:'#0a0a0a' }}>
    <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,transparent,rgba(184,115,51,0.15))' }} />
    <span style={{ color:'rgba(184,115,51,0.3)', fontSize:'12px' }}>❧ ✦ ❧</span>
    <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,rgba(184,115,51,0.15),transparent)' }} />
  </div>
);

const GoldDust = () => {
  const isMobile = useIsMobile();
  const count = isMobile ? 40 : 80;
  const particles = React.useMemo(() => Array.from({length:count}, (_,i) => ({
    id:i, x:Math.random()*100, y:Math.random()*100,
    size:Math.random()*3+0.5, dur:Math.random()*6+4,
    delay:Math.random()*8, opacity:Math.random()*0.5+0.1,
    drift:(Math.random()-0.5)*30,
  })), [count]);
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden' }}>
      <style>{`@keyframes goldFloat{0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:var(--op)}33%{transform:translateY(-18px) translateX(var(--dx)) scale(1.3);opacity:calc(var(--op)*1.8)}66%{transform:translateY(-8px) translateX(calc(var(--dx)*-0.5)) scale(0.8);opacity:calc(var(--op)*0.6)}}`}</style>
      {particles.map(p => (
        <div key={p.id} style={{ position:'absolute', left:`${p.x}%`, top:`${p.y}%`, width:`${p.size}px`, height:`${p.size}px`, borderRadius:'50%', background:p.size>2.5?'#edd9bc':'#b87333', '--op':p.opacity, '--dx':`${p.drift}px`, animation:`goldFloat ${p.dur}s ${p.delay}s ease-in-out infinite`, boxShadow:p.size>2?`0 0 ${p.size*2}px rgba(184,115,51,0.6)`:'none' }} />
      ))}
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────
const PAGES = ['home','services','salon','gallery','contact'];

const App = () => {
  const isMobile = useIsMobile();
  const [activePage, setActivePage] = React.useState('home');
  const headerH = isMobile ? 56 : 64;

  const handleNavigate = page => {
    if (!PAGES.includes(page)) return;
    setActivePage(page);
    const el = document.getElementById(page);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - headerH, behavior:'smooth' });
  };

  React.useEffect(() => {
    const onScroll = () => {
      const scrollY = window.scrollY + 100;
      for (let i = PAGES.length - 1; i >= 0; i--) {
        const el = document.getElementById(PAGES[i]);
        if (el && el.offsetTop <= scrollY) { setActivePage(PAGES[i]); break; }
      }
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div>
      <GoldDust />
      <Header activePage={activePage} onNavigate={handleNavigate} />
      <div id="home"><Hero onNavigate={handleNavigate} /></div>
      <SectionDivider />
      <div id="services"><Services onNavigate={handleNavigate} /></div>
      <SectionDivider />
      <div id="salon"><AcademyPromo /></div>
      <SectionDivider />
      <div id="gallery"><Gallery /></div>
      <Footer onNavigate={handleNavigate} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
