<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cveti's Secret — Beauty Salon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #0a0a0a;
    color: #f0e8d0;
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
  }
  .contact-input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 5px;
    padding: 12px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: #f0e8d0;
    outline: none;
    transition: border-color 0.3s ease;
  }
  .contact-input:focus {
    border-color: rgba(201,168,76,0.6);
    box-shadow: 0 0 12px rgba(201,168,76,0.1);
  }
  .contact-input::placeholder { color: #6e5e42; }
  textarea.contact-input { resize: vertical; min-height: 100px; }
  div::-webkit-scrollbar { display: none; }
  /* Instagram embed overrides */
  .ig-wrapper { flex-shrink: 0; width: 326px; min-height: 540px; border-radius: 12px; border: 1px solid rgba(201,168,76,0.3); transition: border-color 0.3s ease, box-shadow 0.3s ease; background: #fff; }
  .ig-wrapper:hover { border-color: rgba(201,168,76,0.6); box-shadow: 0 0 20px rgba(201,168,76,0.15); }
  .ig-wrapper .instagram-media { min-width: 326px !important; max-width: 326px !important; margin: 0 !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; width: 326px !important; }
  .ig-wrapper iframe { width: 326px !important; }
</style>
<script async src="//www.instagram.com/embed.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ── Header ────────────────────────────────────────────────────────
const Header = ({ activePage, onNavigate }) => {
  const navLinks = [
    { id: 'home', label: 'Начало' },
    { id: 'services', label: 'Услуги' },
    { id: 'salon', label: 'Салонът' },
    { id: 'contact', label: 'Контакти' },
  ];
  return (
    <header style={{
      position:'fixed', top:0, left:0, right:0, zIndex:100,
      background:'rgba(10,10,10,0.96)', backdropFilter:'blur(10px)',
      borderBottom:'1px solid rgba(255,255,255,0.06)',
      height:'64px', display:'flex', alignItems:'center', padding:'0 36px',
    }}>
      <div onClick={() => onNavigate('home')} style={{ cursor:'pointer', flexShrink:0 }}>
        <span style={{ fontFamily:"'Cinzel',serif", fontSize:'15px', fontWeight:600, letterSpacing:'0.08em', color:'#f0e8d0' }}>
          Cveti's Secret
        </span>
      </div>
      <div style={{ width:'1px', height:'22px', background:'rgba(255,255,255,0.25)', margin:'0 28px', flexShrink:0 }} />
      <nav style={{ display:'flex', gap:'36px', alignItems:'center' }}>
        {navLinks.map(link => (
          <span key={link.id} onClick={() => onNavigate(link.id)}
            style={{
              fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.06em',
              color: activePage === link.id ? '#c9a84c' : 'rgba(240,232,208,0.75)',
              cursor:'pointer', transition:'color 0.3s ease', whiteSpace:'nowrap',
            }}
            onMouseEnter={e => e.target.style.color = '#c9a84c'}
            onMouseLeave={e => e.target.style.color = activePage === link.id ? '#c9a84c' : 'rgba(240,232,208,0.75)'}
          >{link.label}</span>
        ))}
      </nav>
      <div style={{ flex:1 }} />
    </header>
  );
};

// ── Hero ──────────────────────────────────────────────────────────
const Hero = ({ onNavigate }) => {
  const [titleVisible, setTitleVisible] = React.useState(false);
  const [tagVisible, setTagVisible] = React.useState(false);
  const [btnVisible, setBtnVisible] = React.useState(false);
  const [imgVisible, setImgVisible] = React.useState(false);

  React.useEffect(() => {
    const t1 = setTimeout(() => setTagVisible(true), 200);
    const t2 = setTimeout(() => setTitleVisible(true), 500);
    const t3 = setTimeout(() => setBtnVisible(true), 900);
    const t4 = setTimeout(() => setImgVisible(true), 300);
    return () => [t1,t2,t3,t4].forEach(clearTimeout);
  }, []);

  return (
    <section style={{
      position:'relative', width:'100%', minHeight:'100vh',
      background:'#0d0d0d', overflow:'hidden',
      display:'flex', alignItems:'center', paddingTop:'64px',
    }}>
      <div style={{
        position:'absolute', inset:0,
        background:'radial-gradient(ellipse at 30% 60%, rgba(20,15,5,1) 0%, #0a0a0a 60%, #080808 100%)',
      }} />
      <div style={{
        position:'absolute', bottom:'-80px', left:'-60px', width:'400px', height:'300px',
        background:'radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%)',
        pointerEvents:'none',
      }} />
      <div style={{
        position:'relative', zIndex:2, display:'flex', alignItems:'center',
        justifyContent:'space-between', width:'100%',
        minHeight:'calc(100vh - 64px)', padding:'0 0 0 5vw',
      }}>
        <div style={{ flex:'0 0 auto', maxWidth:'420px', paddingBottom:'40px', paddingTop:'20px' }}>
          <div style={{
            display:'flex', alignItems:'center', gap:'10px', marginBottom:'20px',
            opacity: tagVisible ? 1 : 0,
            transform: tagVisible ? 'translateY(0)' : 'translateY(12px)',
            transition:'opacity 0.6s ease, transform 0.6s ease',
          }}>
            <div style={{ width:'28px', height:'2px', background:'linear-gradient(90deg,#f5e6a3,#c9a84c)' }} />
            <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'13px', letterSpacing:'0.08em', color:'rgba(240,232,208,0.7)' }}>
              С над 10 години опит
            </span>
          </div>
          <h1 style={{
            fontFamily:"'Cormorant Garamond',serif",
            fontSize:'clamp(28px, 3.5vw, 44px)', fontWeight:400, fontStyle:'italic',
            lineHeight:1.35, color:'#f0e8d0', margin:'0 0 36px', letterSpacing:'0.02em',
            opacity: titleVisible ? 1 : 0,
            transform: titleVisible ? 'translateY(0)' : 'translateY(20px)',
            transition:'opacity 0.8s ease, transform 0.8s ease',
          }}>
            От Чикаго до България –<br />
            Cveti's Secret започва с<br />
            експертиза в русите коси и<br />
            балеажа и се развива в<br />
            пространство за цялостна<br />
            грижа за визията.
          </h1>
          <div style={{
            opacity: btnVisible ? 1 : 0,
            transform: btnVisible ? 'translateY(0)' : 'translateY(16px)',
            transition:'opacity 0.7s ease, transform 0.7s ease',
          }}>
            <button onClick={() => onNavigate('contact')} style={{
              display:'inline-flex', alignItems:'center', gap:'12px',
              fontFamily:"'Cinzel',serif", fontSize:'12px', fontWeight:400,
              letterSpacing:'0.12em', color:'#f0e8d0',
              background:'transparent', border:'1px solid rgba(240,232,208,0.5)',
              borderRadius:'4px', padding:'12px 20px 12px 24px',
              cursor:'pointer', transition:'all 0.35s ease',
            }}
            onMouseEnter={e => {
              e.currentTarget.style.borderColor = '#c9a84c';
              e.currentTarget.style.color = '#c9a84c';
              e.currentTarget.style.boxShadow = '0 0 16px rgba(201,168,76,0.2)';
            }}
            onMouseLeave={e => {
              e.currentTarget.style.borderColor = 'rgba(240,232,208,0.5)';
              e.currentTarget.style.color = '#f0e8d0';
              e.currentTarget.style.boxShadow = 'none';
            }}>
              Запази час
              <span style={{
                display:'inline-flex', alignItems:'center', justifyContent:'center',
                width:'28px', height:'28px', borderRadius:'50%',
                background:'rgba(240,232,208,0.12)', fontSize:'14px', color:'inherit',
              }}>↗</span>
            </button>
          </div>
        </div>
        <div style={{
          flex:'1 1 auto', display:'flex', justifyContent:'flex-end',
          alignItems:'flex-end', alignSelf:'stretch', position:'relative',
          opacity: imgVisible ? 1 : 0,
          transform: imgVisible ? 'translateX(0)' : 'translateX(40px)',
          transition:'opacity 1s ease, transform 1s ease',
        }}>
          <img src="assets/team-billboard.jpg" alt="Cveti's Secret Team" style={{
            height:'100%', maxHeight:'calc(100vh - 64px)',
            width:'auto', objectFit:'contain', objectPosition:'right bottom', display:'block',
            maskImage:'linear-gradient(to right, transparent 0%, rgba(0,0,0,0.4) 20%, black 45%)',
            WebkitMaskImage:'linear-gradient(to right, transparent 0%, rgba(0,0,0,0.4) 20%, black 45%)',
          }} />
        </div>
      </div>
    </section>
  );
};

// ── Services ──────────────────────────────────────────────────────
const SERVICES_DATA = [
  { category:'Коса', items:[
    { name:'Подстригване (дамско)', price:'40 лв.' },
    { name:'Подстригване (мъжко)', price:'25 лв.' },
    { name:'Сешоар', price:'30 лв.' },
    { name:'Изправяне', price:'35 лв.' },
  ]},
  { category:'Боядисване', items:[
    { name:'Балаж', price:'от 120 лв.' },
    { name:'Омбре', price:'от 100 лв.' },
    { name:'Цялостно боядисване', price:'от 60 лв.' },
    { name:'Кичури', price:'от 80 лв.' },
  ]},
  { category:'Прически', items:[
    { name:'Официална прическа', price:'от 80 лв.' },
    { name:'Ежедневна прическа', price:'от 40 лв.' },
    { name:'Плитка', price:'от 50 лв.' },
  ]},
  { category:'Нокти', items:[
    { name:'Маникюр (класически)', price:'25 лв.' },
    { name:'Маникюр (гел)', price:'40 лв.' },
    { name:'Педикюр (класически)', price:'30 лв.' },
    { name:'Педикюр (СПА)', price:'50 лв.' },
  ]},
  { category:'Грим', items:[
    { name:'Дневен грим', price:'60 лв.' },
    { name:'Вечерен грим', price:'80 лв.' },
    { name:'Сватбен грим', price:'от 150 лв.' },
  ]},
  { category:'Масаж', items:[
    { name:'Релаксиращ масаж', price:'70 лв.' },
    { name:'Антицелулитен масаж', price:'80 лв.' },
  ]},
];

const ServiceCard = ({ service }) => {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      background:'#1a1a1a',
      border:`1px solid ${hovered ? 'rgba(201,168,76,0.65)' : 'rgba(201,168,76,0.3)'}`,
      borderRadius:'12px',
      boxShadow: hovered
        ? 'inset 0 0 24px rgba(201,168,76,0.1), 0 8px 40px rgba(0,0,0,0.8), 0 0 24px rgba(201,168,76,0.2)'
        : 'inset 0 0 20px rgba(201,168,76,0.05), 0 4px 24px rgba(0,0,0,0.6)',
      padding:'36px 24px', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', cursor:'pointer',
      transform: hovered ? 'scale(1.02)' : 'scale(1)',
      transition:'all 0.4s ease', position:'relative', overflow:'hidden', minHeight:'140px', gap:'8px',
    }}>
      <div style={{
        position:'absolute', inset:0,
        background:`radial-gradient(ellipse at center, ${hovered ? 'rgba(201,168,76,0.07)' : 'rgba(201,168,76,0.03)'} 0%, transparent 70%)`,
        transition:'all 0.4s ease', pointerEvents:'none',
      }} />
      <div style={{
        fontFamily:"'Great Vibes',cursive", fontSize:'36px',
        background:'linear-gradient(135deg,#f5e6a3 0%,#c9a84c 50%,#8b6914 100%)',
        WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text',
        lineHeight:1.1, position:'relative', zIndex:1, textAlign:'center',
      }}>{service.category}</div>
      <div style={{
        fontFamily:"'Cormorant Garamond',serif", fontSize:'11px', letterSpacing:'0.14em',
        textTransform:'uppercase', color:'#9e8e6a', position:'relative', zIndex:1,
      }}>{service.items.length} услуги</div>
    </div>
  );
};

const ServicesOverlay = ({ open, onClose }) => {
  const [activeCategory, setActiveCategory] = React.useState(0);
  const [itemsVisible, setItemsVisible] = React.useState(false);

  React.useEffect(() => {
    if (open) {
      setItemsVisible(false);
      const t = setTimeout(() => setItemsVisible(true), 200);
      return () => clearTimeout(t);
    }
  }, [open, activeCategory]);

  React.useEffect(() => {
    if (open) document.body.style.overflow = 'hidden';
    else document.body.style.overflow = '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, pointerEvents: open ? 'all' : 'none' }}>
      <div onClick={onClose} style={{
        position:'absolute', inset:0, background:'rgba(0,0,0,0.92)', backdropFilter:'blur(8px)',
        opacity: open ? 1 : 0, transition:'opacity 0.5s ease',
      }} />
      <div style={{
        position:'absolute', bottom:0, left:0, right:0, height:'85vh',
        background:'#0f0f0f', borderTop:'1px solid rgba(201,168,76,0.25)',
        transform: open ? 'translateY(0)' : 'translateY(100%)',
        transition:'transform 0.55s cubic-bezier(0.16,1,0.3,1)',
        display:'flex', flexDirection:'column', overflow:'hidden',
      }}>
        <div style={{ height:'2px', background:'linear-gradient(90deg,transparent,#c9a84c 30%,#f5e6a3 50%,#c9a84c 70%,transparent)', flexShrink:0 }} />
        <div style={{
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'24px 48px 16px', borderBottom:'1px solid rgba(201,168,76,0.1)', flexShrink:0,
        }}>
          <h2 style={{
            fontFamily:"'Great Vibes',cursive", fontSize:'42px',
            background:'linear-gradient(135deg,#f5e6a3,#c9a84c 50%,#8b6914)',
            WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', lineHeight:1,
          }}>Нашите услуги</h2>
          <button onClick={onClose} style={{
            background:'transparent', border:'1px solid rgba(201,168,76,0.3)',
            borderRadius:'50%', width:'40px', height:'40px', color:'#c9a84c',
            fontSize:'18px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
            transition:'all 0.3s ease', fontFamily:'sans-serif',
          }}
          onMouseEnter={e => e.currentTarget.style.background='rgba(201,168,76,0.1)'}
          onMouseLeave={e => e.currentTarget.style.background='transparent'}
          >✕</button>
        </div>
        <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
          <div style={{ width:'240px', flexShrink:0, borderRight:'1px solid rgba(201,168,76,0.1)', padding:'24px 0', overflowY:'auto' }}>
            {SERVICES_DATA.map((cat, i) => (
              <div key={i} onClick={() => { setActiveCategory(i); setItemsVisible(false); setTimeout(()=>setItemsVisible(true),80); }}
                style={{
                  padding:'14px 32px', cursor:'pointer',
                  fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.12em', textTransform:'uppercase',
                  color: activeCategory===i ? '#c9a84c' : 'rgba(240,232,208,0.5)',
                  background: activeCategory===i ? 'rgba(201,168,76,0.06)' : 'transparent',
                  borderLeft: activeCategory===i ? '2px solid #c9a84c' : '2px solid transparent',
                  transition:'all 0.25s ease',
                }}
                onMouseEnter={e=>{ if(activeCategory!==i) e.currentTarget.style.color='rgba(240,232,208,0.8)'; }}
                onMouseLeave={e=>{ if(activeCategory!==i) e.currentTarget.style.color='rgba(240,232,208,0.5)'; }}
              >
                {cat.category}
                <span style={{
                  display:'block', fontFamily:"'Cormorant Garamond',serif",
                  fontSize:'11px', textTransform:'none', letterSpacing:'0.04em',
                  color:'rgba(158,142,106,0.6)', marginTop:'2px', fontStyle:'italic',
                }}>{cat.items.length} услуги</span>
              </div>
            ))}
          </div>
          <div style={{ flex:1, padding:'24px 48px', overflowY:'auto' }}>
            <div style={{
              fontFamily:"'Great Vibes',cursive", fontSize:'36px',
              background:'linear-gradient(135deg,#f5e6a3,#c9a84c 50%,#8b6914)',
              WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', marginBottom:'8px',
            }}>{SERVICES_DATA[activeCategory].category}</div>
            <div style={{ width:'40px', height:'1px', background:'linear-gradient(90deg,#f5e6a3,#c9a84c)', marginBottom:'28px' }} />
            <div style={{ display:'flex', flexDirection:'column' }}>
              {SERVICES_DATA[activeCategory].items.map((item, i) => (
                <div key={i} style={{
                  display:'flex', alignItems:'center', justifyContent:'space-between',
                  padding:'16px 0', borderBottom:'1px solid rgba(201,168,76,0.08)',
                  opacity: itemsVisible ? 1 : 0,
                  transform: itemsVisible ? 'translateX(0)' : 'translateX(-16px)',
                  transition:`opacity 0.4s ease ${i*0.06}s, transform 0.4s ease ${i*0.06}s`,
                }}>
                  <div>
                    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'18px', color:'#f0e8d0', letterSpacing:'0.04em' }}>{item.name}</div>
                    <div style={{ fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.14em', color:'rgba(201,168,76,0.5)', textTransform:'uppercase', marginTop:'2px' }}>{SERVICES_DATA[activeCategory].category}</div>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:'20px', flexShrink:0 }}>
                    <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'18px', fontWeight:600, color:'#c9a84c' }}>{item.price}</span>
                    <a href="https://www.fresha.com" target="_blank" rel="noopener noreferrer" style={{
                      fontFamily:"'Cinzel',serif", fontSize:'10px', fontWeight:600, letterSpacing:'0.14em', textTransform:'uppercase',
                      color:'#0a0a0a', background:'linear-gradient(90deg,#f5e6a3,#c9a84c,#8b6914)',
                      border:'none', borderRadius:'4px', padding:'9px 18px', cursor:'pointer',
                      textDecoration:'none', display:'inline-block', transition:'all 0.3s ease',
                      boxShadow:'0 2px 12px rgba(201,168,76,0.25)', whiteSpace:'nowrap',
                    }}
                    onMouseEnter={e=>{e.currentTarget.style.opacity='0.85';e.currentTarget.style.boxShadow='0 4px 20px rgba(201,168,76,0.45)';}}
                    onMouseLeave={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.boxShadow='0 2px 12px rgba(201,168,76,0.25)';}}
                    >Запази сега</a>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const Services = ({ onNavigate }) => {
  const [overlayOpen, setOverlayOpen] = React.useState(false);
  return (
    <>
      <ServicesOverlay open={overlayOpen} onClose={() => setOverlayOpen(false)} />
      <section style={{ background:'#111111', padding:'100px 40px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', bottom:0, left:0, width:'300px', height:'300px', background:'radial-gradient(circle,rgba(201,168,76,0.06) 0%,transparent 70%)', pointerEvents:'none' }} />
        <div style={{ position:'absolute', top:0, right:0, width:'200px', height:'200px', background:'radial-gradient(circle,rgba(201,168,76,0.05) 0%,transparent 70%)', pointerEvents:'none' }} />
        <div style={{ maxWidth:'1200px', margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:'60px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:'16px', marginBottom:'12px' }}>
              <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,transparent,rgba(201,168,76,0.4))' }} />
              <span style={{ color:'#c9a84c', fontSize:'16px' }}>✦</span>
              <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,rgba(201,168,76,0.4),transparent)' }} />
            </div>
            <h2 style={{
              fontFamily:"'Great Vibes',cursive", fontSize:'56px',
              background:'linear-gradient(135deg,#f5e6a3,#c9a84c 50%,#8b6914)',
              WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', margin:'0 0 12px',
            }}>Нашите услуги</h2>
            <div style={{ width:'60px', height:'2px', background:'linear-gradient(90deg,#f5e6a3,#c9a84c,#8b6914)', margin:'0 auto' }} />
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'24px', marginBottom:'48px' }}>
            {SERVICES_DATA.map((s,i) => <ServiceCard key={i} service={s} />)}
          </div>
          <div style={{ textAlign:'center' }}>
            <button onClick={() => setOverlayOpen(true)} style={{
              fontFamily:"'Cormorant Garamond',serif", fontSize:'14px', fontWeight:600,
              letterSpacing:'0.18em', textTransform:'uppercase',
              color:'#c9a84c', background:'transparent',
              border:'1.5px solid rgba(201,168,76,0.5)', borderRadius:'6px',
              padding:'13px 40px', cursor:'pointer', transition:'all 0.4s ease',
            }}
            onMouseEnter={e=>{e.target.style.background='#c9a84c';e.target.style.color='#0a0a0a';e.target.style.boxShadow='0 0 20px rgba(201,168,76,0.4)';}}
            onMouseLeave={e=>{e.target.style.background='transparent';e.target.style.color='#c9a84c';e.target.style.boxShadow='none';}}
            >Вижте повече</button>
          </div>
        </div>
      </section>
    </>
  );
};

// ── Team ──────────────────────────────────────────────────────────
// Set photo to a file path or URL to show a photo inside the circle, e.g. 'assets/cveti.jpg'
const TEAM = [
  { id:1, name:'Цвети Иванова', role:'Основател & Стилист', photo:'' },
  { id:2, name:'Мария Петрова', role:'Колорист', photo:'' },
  { id:3, name:'Елена Георгиева', role:'Маникюрист', photo:'' },
  { id:4, name:'Николета Димова', role:'Гримьор', photo:'' },
];

const TeamMember = ({ member }) => {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      display:'flex', flexDirection:'column', alignItems:'center', gap:'14px',
      cursor:'pointer', transition:'all 0.4s ease',
      transform: hovered ? 'translateY(-4px)' : 'translateY(0)',

// ── Before/After Slider ───────────────────────────────────────────
const BeforeAfterSlider = ({ label }) => {
  const [pos, setPos] = React.useState(50);
  const [dragging, setDragging] = React.useState(false);
  const [hovered, setHovered] = React.useState(false);
  const containerRef = React.useRef(null);
  const updatePos = React.useCallback((clientX) => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setPos(Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100)));
  }, []);
  return (
    <div ref={containerRef}
      onMouseMove={e => { if (hovered || dragging) updatePos(e.clientX); }}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => { setHovered(false); setDragging(false); setPos(50); }}
      onMouseDown={() => setDragging(true)}
      onMouseUp={() => setDragging(false)}
      style={{ position:'relative', width:'280px', height:'320px', borderRadius:'10px', overflow:'hidden', border:'1px solid rgba(201,168,76,0.3)', cursor:'col-resize', flexShrink:0, userSelect:'none' }}
    >
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(135deg,#1a2a10,#0d1a08,#0a0d0a)', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <span style={{ fontFamily:"'Cinzel',serif", fontSize:'11px', letterSpacing:'0.14em', color:'rgba(201,168,76,0.3)', textTransform:'uppercase' }}>После</span>
      </div>
      <div style={{ position:'absolute', inset:0, clipPath:`inset(0 ${100-pos}% 0 0)`, transition: dragging?'none':'clip-path 0.05s ease', background:'linear-gradient(135deg,#2a1e08,#1a1208,#0d0d0d)', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <span style={{ fontFamily:"'Cinzel',serif", fontSize:'11px', letterSpacing:'0.14em', color:'rgba(201,168,76,0.3)', textTransform:'uppercase' }}>Преди</span>
      </div>
      <div style={{ position:'absolute', top:0, bottom:0, left:`${pos}%`, width:'2px', background:'linear-gradient(180deg,transparent,#c9a84c 20%,#f5e6a3 50%,#c9a84c 80%,transparent)', transform:'translateX(-50%)', boxShadow:'0 0 8px rgba(201,168,76,0.6)', transition:dragging?'none':'left 0.05s ease', pointerEvents:'none' }} />
      <div style={{ position:'absolute', top:'50%', left:`${pos}%`, transform:'translate(-50%,-50%)', width:'36px', height:'36px', borderRadius:'50%', background:'linear-gradient(135deg,#f5e6a3,#c9a84c)', boxShadow:'0 0 12px rgba(201,168,76,0.7)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'12px', color:'#0a0a0a', fontWeight:700, pointerEvents:'none' }}>⇔</div>
      <div style={{ position:'absolute', bottom:'12px', left:'12px', fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', color:'rgba(201,168,76,0.7)', textTransform:'uppercase', background:'rgba(0,0,0,0.6)', padding:'4px 8px', borderRadius:'3px' }}>Преди</div>
      <div style={{ position:'absolute', bottom:'12px', right:'12px', fontFamily:"'Cinzel',serif", fontSize:'9px', letterSpacing:'0.12em', color:'rgba(201,168,76,0.7)', textTransform:'uppercase', background:'rgba(0,0,0,0.6)', padding:'4px 8px', borderRadius:'3px' }}>След</div>
      <div style={{ position:'absolute', top:'14px', left:'50%', transform:'translateX(-50%)', fontFamily:"'Cormorant Garamond',serif", fontSize:'13px', fontStyle:'italic', color:'rgba(240,232,208,0.8)', whiteSpace:'nowrap', background:'rgba(0,0,0,0.5)', padding:'3px 10px', borderRadius:'3px' }}>{label}</div>
      {!hovered && (
        <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.3)', fontFamily:"'Cinzel',serif", fontSize:'10px', letterSpacing:'0.12em', color:'rgba(201,168,76,0.8)', textTransform:'uppercase', flexDirection:'column', gap:'6px', pointerEvents:'none' }}>

          <button onClick={()=>scroll(-1)} style={{ position:'absolute', left:'-20px', top:'50%', transform:'translateY(-50%)', zIndex:10, background:'rgba(10,10,10,0.9)', border:'1px solid rgba(201,168,76,0.3)', borderRadius:'50%', width:'36px', height:'36px', color:'#c9a84c', fontSize:'16px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>

          <div ref={scrollRef} style={{ display:'flex', gap:'16px', overflowX:'auto', paddingBottom:'16px', paddingRight:'40px', scrollbarWidth:'none', msOverflowStyle:'none' }}>
            {INSTAGRAM_POSTS.map((url, i) => <InstagramEmbed key={i} url={url} />)}
          </div>
        </div>
      </div>
    </section>
  );
};

// ── Shared ────────────────────────────────────────────────────────
const SectionDivider = () => (
  <div style={{ display:'flex', alignItems:'center', gap:'16px', padding:'0 40px', background:'#0a0a0a' }}>
    <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,transparent,rgba(201,168,76,0.15))' }} />
    <span style={{ color:'rgba(201,168,76,0.3)', fontSize:'12px' }}>❧ ✦ ❧</span>
    <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg,rgba(201,168,76,0.15),transparent)' }} />
  </div>
);

const GoldDust = () => {
  const particles = React.useMemo(() => Array.from({length:80}, (_,i) => ({
    id:i, x:Math.random()*100, y:Math.random()*100,
    size:Math.random()*3+0.5, dur:Math.random()*6+4,
    delay:Math.random()*8, opacity:Math.random()*0.5+0.1,
    drift:(Math.random()-0.5)*30,
  })), []);
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden' }}>
      <style>{`@keyframes goldFloat{0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:var(--op)}33%{transform:translateY(-18px) translateX(var(--dx)) scale(1.3);opacity:calc(var(--op)*1.8)}66%{transform:translateY(-8px) translateX(calc(var(--dx)*-0.5)) scale(0.8);opacity:calc(var(--op)*0.6)}}`}</style>
      {particles.map(p => (
        <div key={p.id} style={{
          position:'absolute', left:`${p.x}%`, top:`${p.y}%`,
          width:`${p.size}px`, height:`${p.size}px`, borderRadius:'50%',
          background: p.size>2.5 ? '#f5e6a3' : '#c9a84c',
          '--op': p.opacity, '--dx':`${p.drift}px`,
          animation:`goldFloat ${p.dur}s ${p.delay}s ease-in-out infinite`,
          boxShadow: p.size>2 ? `0 0 ${p.size*2}px rgba(201,168,76,0.6)` : 'none',
        }} />
      ))}
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────
const PAGES = ['home','services','salon','gallery','contact'];

const App = () => {
  const [activePage, setActivePage] = React.useState('home');

  const handleNavigate = (page) => {
    if (!PAGES.includes(page)) return;
    setActivePage(page);
    const el = document.getElementById(page);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 64, behavior:'smooth' });
  };

  React.useEffect(() => {
    const onScroll = () => {
      const scrollY = window.scrollY + 100;
      for (let i = PAGES.length - 1; i >= 0; i--) {
        const el = document.getElementById(PAGES[i]);
        if (el && el.offsetTop <= scrollY) { setActivePage(PAGES[i]); break; }
      }
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div>
      <GoldDust />
      <Header activePage={activePage} onNavigate={handleNavigate} />
      <div id="home"><Hero onNavigate={handleNavigate} /></div>
      <SectionDivider />
      <div id="services"><Services onNavigate={handleNavigate} /></div>
      <SectionDivider />
      <div id="salon"><Team /></div>
      <SectionDivider />
      <div id="gallery"><Gallery /></div>
      <SectionDivider />
      <div id="contact"><Contact /></div>
      <Footer onNavigate={handleNavigate} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
