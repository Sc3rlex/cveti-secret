<body>

<script type="text/babel">

const useIsMobile = () => {
  const [m, setM] = React.useState(() => window.innerWidth < 768);
  React.useEffect(() => {
    const h = () => setM(window.innerWidth < 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return m;
};

const PHONE = '+359988992002';

const PhoneIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.68 13.6a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.6a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 18z"/>
  </svg>
);

// ── Header ────────────────────────────────────────────────────────
const Header = () => {

  const [menuOpen, setMenuOpen] = React.useState(false);

  const navLinks = [
    { id:'home',    label:'Начало',   href:'index.html' },
    { id:'services',label:'Услуги',   href:'index.html#services' },
    { id:'salon',   label:'Салонът',  href:'index.html#salon' },
    { id:'gallery', label:'Галерия',  href:'index.html#gallery' },
    { id:'contact', label:'Контакти', href:'index.html#contact' },
  ];

  React.useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [menuOpen]);

  if (isMobile) return (
    <>
      <header style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, background:'rgba(10,10,10,0.96)', backdropFilter:'blur(10px)', borderBottom:'1px solid rgba(255,255,255,0.06)', height:'70px', display:'flex', alignItems:'center', padding:'0 16px' }}>
        <button onClick={() => setMenuOpen(true)} style={{ background:'transparent', border:'none', cursor:'pointer', padding:'8px 8px 8px 0', display:'flex', flexDirection:'column', gap:'5px', flexShrink:0 }}>
          {[0,1,2].map(i => <div key={i} style={{ width:'22px', height:'2px', background:'#b87333', borderRadius:'2px' }} />)}
        </button>
        <a href="index.html" style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', cursor:'pointer', textDecoration:'none' }}>
          <img src="assets/logo-ring-bronze.png" alt="Cveti's Secret" style={{ height:'48px', display:'block' }} />

        <div style={{ marginLeft:'auto' }}>
          <a href={`tel:${PHONE}`} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'36px', height:'36px', borderRadius:'50%', border:'1px solid rgba(184,115,51,0.5)', color:'#b87333', textDecoration:'none' }}>
            <PhoneIcon />
          </a>
        </div>
      </header>

      <div style={{ position:'fixed', inset:0, zIndex:200, pointerEvents: menuOpen ? 'all' : 'none' }}>
        <div onClick={() => setMenuOpen(false)} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.75)', opacity: menuOpen ? 1 : 0, transition:'opacity 0.3s ease' }} />
        <div style={{ position:'absolute', left:0, top:0, bottom:0, width:'75vw', maxWidth:'300px', background:'#0c0c0c', borderRight:'1px solid rgba(184,115,51,0.15)', transform: menuOpen ? 'translateX(0)' : 'translateX(-100%)', transition:'transform 0.38s cubic-bezier(0.16,1,0.3,1)', display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ height:'2px', background:'linear-gradient(90deg,#b87333,rgba(184,115,51,0.1))', flexShrink:0 }} />
          <div style={{ padding:'28px 24px 22px', borderBottom:'1px solid rgba(184,115,51,0.08)' }}>
            <div style={{ fontFamily:"'Cinzel',serif", fontSize:'15px', fontWeight:600, letterSpacing:'0.12em', background:'linear-gradient(90deg,#edd9bc,#b87333)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>Cveti's Secret</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'12px', fontStyle:'italic', color:'#9e8e6a', marginTop:'3px', letterSpacing:'0.1em' }}>Academy</div>
          </div>
          <nav style={{ flex:1, padding:'12px 0', overflowY:'auto' }}>
            {navLinks.map(link => (
              <a key={link.id} href={link.href} style={{ display:'block', padding:'15px 24px', cursor:'pointer', fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(240,232,208,0.55)', borderLeft:'2px solid transparent', background:'transparent', transition:'all 0.2s ease', textDecoration:'none' }}>

            <a href="academy.html" style={{ display:'block', padding:'15px 24px', fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.12em', textTransform:'uppercase', color:'#b87333', borderLeft:'2px solid #b87333', background:'rgba(184,115,51,0.05)', textDecoration:'none' }}>
              Академия ✦
            </a>
          </nav>
          <div style={{ padding:'20px 24px', borderTop:'1px solid rgba(184,115,51,0.08)' }}>
            <a href={`tel:${PHONE}`} style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', padding:'13px', borderRadius:'6px', background:'linear-gradient(90deg,#edd9bc,#b87333,#7a4520)', fontFamily:"'Cinzel',serif", fontSize:'10px', fontWeight:600, letterSpacing:'0.14em', textTransform:'uppercase', color:'#0a0a0a', textDecoration:'none' }}>
              <PhoneIcon /> Запази час
            </a>
          </div>
        </div>
      </div>
    </>
  );

  return (
    <header style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, background:'rgba(10,10,10,0.96)', backdropFilter:'blur(10px)', borderBottom:'1px solid rgba(255,255,255,0.06)', height:'76px', display:'flex', alignItems:'center', padding:'0 40px' }}>
      <a href="index.html" style={{ cursor:'pointer', flexShrink:0, textDecoration:'none' }}>
        <img src="assets/logo-ring-bronze.png" alt="Cveti's Secret" style={{ height:'60px', display:'block' }} />
      </a>
      <nav style={{ flex:1, display:'flex', gap:'40px', alignItems:'center', justifyContent:'center' }}>
        {navLinks.map(link => (
          <a key={link.id} href={link.href}
            style={{ fontFamily:"'Cinzel',serif", fontSize:'20px', letterSpacing:'0.1em', color:'rgba(240,232,208,0.8)', cursor:'pointer', transition:'color 0.3s ease', whiteSpace:'nowrap', textDecoration:'none' }}
            onMouseEnter={e => e.target.style.color='#b87333'}
            onMouseLeave={e => e.target.style.color='rgba(240,232,208,0.8)'}
          >{link.label}</a>
        ))}
        <a href="academy.html"
          style={{ fontFamily:"'Cinzel',serif", fontSize:'20px', letterSpacing:'0.1em', color:'#b87333', cursor:'pointer', transition:'color 0.3s ease', whiteSpace:'nowrap', textDecoration:'none' }}
        >Академия</a>
      </nav>
      <a href={`tel:${PHONE}`} style={{ flexShrink:0, display:'flex', alignItems:'center', gap:'9px', padding:'11px 22px', borderRadius:'4px', border:'1px solid rgba(184,115,51,0.5)', color:'#b87333', textDecoration:'none', fontFamily:"'Cinzel',serif", fontSize:'12px', letterSpacing:'0.12em', transition:'all 0.3s ease' }}
        onMouseEnter={e=>{e.currentTarget.style.background='rgba(184,115,51,0.08)';e.currentTarget.style.borderColor='#b87333';}}
        onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='rgba(184,115,51,0.5)';}}>
        <PhoneIcon /> Запази час
      </a>
    </header>
  );
};

// ── Academy data ──────────────────────────────────────────────────
const MODULES = [
  { id:'full',     title:'Цялостно обучение',     subtitle:'Всички модули включени',        featured:true, fullWidth:true },
  { id:'color',    title:'Колористика',           subtitle:'Техники за боядисване & нюанси'                               },
  { id:'balayage', title:'Балеаж',                subtitle:'Sunlights, ombre & freehand'                                  },
  { id:'correct',  title:'Официални прически',     subtitle:'Официални & ежедневни стилове'                                },
  { id:'cut',      title:'Подстригване',          subtitle:'Класически & модерни стрижки'                                 },
  { id:'style',    title:'Стайлинг',              subtitle:'Прически & оформяне'                                          },
  { id:'trich',    title:'Трихология',            subtitle:'Здраве & грижа за косата'                                     },
  { id:'keratin',  title:'Кератинови Екстеншъни', subtitle:'Поставяне & поддръжка',         fullWidth:true                },
];

const COURSES_PLAN = [
  {
    id: 'basic',
    title: 'Основно обучение',
    duration: '1 месец',
    price: '2 200 €',
    includes: [
      'Теория на цвета',
      'Колористика & техники за боядисване',
      'Балеаж & ombre',
      'Цветови корекции',

      'Стайлинг & прически',

    duration: '2 дни',
    price: '1 200 €',
    includes: [
      'Усъвършенствани техники',
      'Индивидуален подход',
      'Работа с реални клиенти',
      'Сертификат за надградено ниво',
    ]
  }
];

// ── Module icons ──────────────────────────────────────────────────
const ModuleIcon = ({ id, size=24 }) => {
  const p = { width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round' };
  switch(id) {
    case 'full':     return <svg {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    case 'color':    return <svg {...p}><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10c0 1.657-1.343 3-3 3h-2a1 1 0 0 0-1 1v1a2 2 0 0 1-2 2"/><circle cx="7" cy="11" r="1.2" fill="currentColor"/><circle cx="11" cy="8" r="1.2" fill="currentColor"/><circle cx="17" cy="11" r="1.2" fill="currentColor"/></svg>;
    case 'balayage': return <svg {...p}><path d="M3 17 15 5m-4 16 8-8m-4 8 6-6"/><circle cx="19" cy="5" r="2"/></svg>;
    case 'correct':  return <svg {...p}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>;
    case 'cut':      return <svg {...p}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>;
    case 'style':    return <svg {...p}><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>;
    case 'trich':    return <svg {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
    case 'keratin':  return <svg {...p}><path d="M12 2c-2 4-4 6-4 10a4 4 0 0 0 8 0c0-4-2-6-4-10z"/><path d="M12 12v10m-3-3h6"/></svg>;
    default:         return <svg {...p}><circle cx="12" cy="12" r="10"/></svg>;
  }
};

// ── Wizard ────────────────────────────────────────────────────────
const AcademyWizard = () => {
  const isMobile = useIsMobile();
  const [step, setStep] = React.useState(1);
  const [module, setModule] = React.useState(null);

  const canNext1 = !!module;

  // Step indicator
  const StepDot = ({ n, label }) => {
    const done   = step > n;
    const active = step === n;
    return (
      <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
        <div style={{ width:'36px', height:'36px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, background: done ? '#b87333' : 'transparent', border: done ? 'none' : active ? '2px solid #b87333' : '2px solid rgba(184,115,51,0.25)', transition:'all 0.4s ease' }}>
          {done
            ? <span style={{ color:'#0a0a0a', fontSize:'14px', fontWeight:700 }}>✓</span>
            : <span style={{ fontFamily:"'Cinzel',serif", fontSize:'13px', fontWeight:600, color: active ? '#b87333' : 'rgba(184,115,51,0.35)' }}>{n}</span>
          }
        </div>
        {!isMobile && <span style={{ fontFamily:"'Cinzel',serif", fontSize:'10px', letterSpacing:'0.14em', textTransform:'uppercase', color: active ? '#edd9bc' : done ? '#b87333' : 'rgba(240,232,208,0.3)', whiteSpace:'nowrap' }}>{label}</span>}
      </div>
    );
  };

  const StepConnector = () => (
    <div style={{ flex:1, height:'1px', background: step > 1 ? 'linear-gradient(90deg,#b87333,rgba(184,115,51,0.4))' : 'rgba(184,115,51,0.15)', transition:'background 0.4s ease', margin:'0 8px' }} />
  );

  // ── Step 1 — Choose module ──
  const Step1 = () => (
    <div>
      {/* Intro */}
      <div style={{ background:'rgba(184,115,51,0.05)', border:'1px solid rgba(184,115,51,0.15)', borderRadius:'14px', padding: isMobile ? '28px 20px' : '36px 44px', marginBottom: isMobile ? '36px' : '48px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:'16px', marginBottom:'22px' }}>
          <div style={{ flexShrink:0, width: isMobile ? '48px' : '56px', height: isMobile ? '48px' : '56px', borderRadius:'50%', background:'linear-gradient(135deg,rgba(237,217,188,0.15),rgba(184,115,51,0.1))', border:'1px solid rgba(184,115,51,0.3)', display:'flex', alignItems:'center', justifyContent:'center', color:'#b87333' }}>
            <ModuleIcon id="full" size={isMobile ? 22 : 26} />
          </div>
          <div style={{ fontFamily:"'Great Vibes',cursive", fontSize: isMobile ? '32px' : '42px', background:'linear-gradient(135deg,#edd9bc,#b87333)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', lineHeight:1.2, paddingBottom:'4px' }}>Hair Secrets Academy</div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
          {[
            <><span style={{ color:'#edd9bc', fontStyle:'italic' }}>Hair Secrets Academy</span> е създадена от <span style={{ color:'#edd9bc', fontStyle:'italic' }}>Цветелина Михайлова</span> – фризьор, предприемач и обучител с над 20 години опит в индустрията на красотата. След успешно развитие на собствен бизнес в България и САЩ и години работа с хиляди клиенти, Цвети създава академия с ясна мисия – да предава реални знания, практически умения и професионален опит на бъдещото поколение фризьори.</>,
            <>Обучението е насочено както към напълно начинаещи, така и към работещи фризьори, които желаят да надградят своите умения и да работят на по-високо професионално ниво.</>,
            <>В Hair Secrets Academy вярваме, че успешният фризьор се изгражда чрез практика, правилни насоки и работа в реална салонна среда. Затова обучението се провежда в малки групи курсисти, с индивидуален подход.</>,
            <>По време на курса ще усвоите съвременни техники за боядисване, изрусяване, балеаж, цветови корекции, стилизиране и работа с клиенти, както и всички основни умения, необходими за изграждането на успешна кариера в сферата на фризьорството.</>,
            <><span style={{ color:'#edd9bc' }}>Нашата цел не е просто да ви научим да правите коса.</span> Нашата цел е да ви подготвим за реалната работа зад стола и да ви дадем увереността да се развивате като истински професионалисти.</>,
          ].map((text, i) => (
            <p key={i} style={{ fontFamily:"'Cormorant Garamond',serif", fontSize: isMobile ? '15px' : '16px', fontWeight:300, color:'rgba(240,232,208,0.72)', lineHeight:1.8 }}>{text}</p>
          ))}
        </div>
      </div>

      <div style={{ textAlign:'center', marginBottom: isMobile ? '28px' : '36px' }}>
        <h3 style={{ fontFamily:"'Great Vibes',cursive", fontSize: isMobile ? '40px' : '52px', background:'linear-gradient(135deg,#edd9bc,#b87333 50%,#7a4520)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', lineHeight:1.3, paddingBottom:'8px', marginBottom:'4px' }}>Избери модул</h3>
        <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'15px', fontStyle:'italic', color:'rgba(240,232,208,0.55)', letterSpacing:'0.06em' }}>Кое умение искаш да развиеш?</p>
      </div>

      {/* Module grid */}
      <div style={{ display:'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: isMobile ? '10px' : '14px', marginBottom:'40px' }}>
        {MODULES.map(m => {
          const sel = module?.id === m.id;
          const isFullW = m.fullWidth && !isMobile;
          return (
            <div key={m.id} onClick={() => setModule(m)}
              style={{ gridColumn: isFullW ? '1 / -1' : 'auto', background: sel ? 'rgba(184,115,51,0.12)' : m.featured ? 'rgba(184,115,51,0.07)' : '#1a1a1a', border:`1.5px solid ${sel ? '#b87333' : m.featured ? 'rgba(184,115,51,0.4)' : 'rgba(184,115,51,0.2)'}`, borderRadius:'14px', padding: isFullW ? (isMobile ? '22px 20px' : '26px 32px') : (isMobile ? '20px 18px' : '24px 22px'), cursor:'pointer', display:'flex', alignItems:'center', gap: isFullW ? '22px' : '18px', transition:'all 0.3s ease', boxShadow: sel ? '0 0 20px rgba(184,115,51,0.18)' : m.featured ? '0 0 16px rgba(184,115,51,0.08)' : 'none', transform: sel ? 'translateY(-1px)' : 'none' }}
              onMouseEnter={e => { if(!sel) e.currentTarget.style.borderColor='rgba(184,115,51,0.55)'; }}
              onMouseLeave={e => { if(!sel) e.currentTarget.style.borderColor = m.featured ? 'rgba(184,115,51,0.4)' : 'rgba(184,115,51,0.2)'; }}
            >
              <div style={{ flexShrink:0, width: isFullW ? '54px' : '48px', height: isFullW ? '54px' : '48px', borderRadius:'50%', background: sel ? 'rgba(184,115,51,0.2)' : 'rgba(184,115,51,0.08)', display:'flex', alignItems:'center', justifyContent:'center', color: sel ? '#edd9bc' : '#b87333', transition:'all 0.3s ease' }}>
                <ModuleIcon id={m.id} size={isFullW ? 26 : 22} />
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:"'Cinzel',serif", fontSize: isFullW ? (isMobile ? '15px' : '18px') : (isMobile ? '14px' : '16px'), fontWeight:600, letterSpacing:'0.08em', color: sel ? '#edd9bc' : m.featured ? '#d4c5a0' : '#b87333', marginBottom:'6px', transition:'color 0.3s ease' }}>{m.title}</div>
                <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize: isMobile ? '14px' : '15px', color:'rgba(240,232,208,0.5)', lineHeight:1.4 }}>{m.subtitle}</div>
              </div>
              {sel && <div style={{ flexShrink:0, width:'24px', height:'24px', borderRadius:'50%', background:'#b87333', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px', color:'#0a0a0a', fontWeight:700 }}>✓</div>}
            </div>
          );
        })}
